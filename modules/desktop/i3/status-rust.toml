[icons]
icons = "none"

[theme]
theme = "plain"

[[block]]
block = "cpu"
interval = 1
format = " CPU $utilization "

[[block]]
block = "memory"
format = " MEM $mem_used_percents "
format_alt = " SWAP $swap_used_percents "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " DISK $available.eng(w:2) "

[[block]]
block = "net"
interval = 2
format = " $ip ↓$speed_down.eng(prefix:K) ↑$speed_up.eng(prefix:K) "

[[block]]
block = "weather"
interval = 600
format = " WEATHER $temp "
[block.service]
name = "metno"
coordinates = ["-16.6869", "-49.2648"]

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %H:%M') "
